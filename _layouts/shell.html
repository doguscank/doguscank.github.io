<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  {% seo %}
  <link rel="icon" href="{{ '/assets/img/initials.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }}">
  <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
  {% if page.math %}<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>{% endif %}
  {% if page.mermaid %}<script type="module">import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs'; mermaid.initialize({startOnLoad:false,theme:'dark'});document.querySelectorAll('pre code.language-mermaid').forEach(code=>{const diagram=document.createElement('div');diagram.className='mermaid';diagram.textContent=code.textContent;code.parentElement.replaceWith(diagram)});mermaid.run();</script>{% endif %}
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div class="site-frame">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Doğuş Can Korkmaz — home">DCK<span class="cursor" aria-hidden="true">_</span></a>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Index<span>01</span></a>
        <a href="{{ '/articles/' | relative_url }}" {% if page.url == '/articles/' %}aria-current="page"{% endif %}>Writing<span>02</span></a>
        <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About<span>03</span></a>
      </nav>
      <a class="header-contact" href="https://www.linkedin.com/in/doguscankorkmaz/">Let's talk <span aria-hidden="true">↗</span></a>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer"><span>© {{ 'now' | date: '%Y' }} DOĞUŞ CAN KORKMAZ</span><span class="footer-links"><a href="https://github.com/doguscank">GITHUB ↗</a><a href="https://www.linkedin.com/in/doguscankorkmaz/">LINKEDIN ↗</a><a href="https://x.com/doguscank_">X ↗</a><a href="{{ '/feed.xml' | relative_url }}">RSS ↗</a></span><a href="#main">BACK TO TOP ↑</a></footer>
  </div>
</body>
</html>
